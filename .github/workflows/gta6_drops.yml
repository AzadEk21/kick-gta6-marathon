name: GTA6_250h_Cloud_Marathon

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: gta6_250h_marathon_group
  cancel-in-progress: true

jobs:
  watch_gta6:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # 5 FARKLI BULUT SUNUCUSU (5 Farklı IP + 5 Ayrı Tarayıcı Oturumu)
        worker_id: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Camoufox
        run: |
          pip install playwright requests camoufox[geoip]
          playwright install firefox
          python -m camoufox fetch

      - name: Run Synchronized GTA 6 Worker (${{ matrix.worker_id }})
        env:
          KICK_COOKIES: ${{ secrets.KICK_COOKIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKER_ID: ${{ matrix.worker_id }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python gta6_cloud_bot.py

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Maraton Durum Önbelleğini Yükle (Cache)
        uses: actions/cache@v4
        with:
          path: marathon_state.json
          key: gta6-state-${{ github.run_id }}
          restore-keys: |
            gta6-state-

      - name: Hafif Ön Kontrol (Tamamlandı mı / Duraklatıldı mı?)
        run: |
          python3 gta6_cloud_bot.py --pre-check

      - name: Python 3.11 Kurulumu
        if: env.SKIP_BOT != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright, Xvfb ve Bağımlılıkları Kur
        if: env.SKIP_BOT != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgbm-dev
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: GTA VI Drops Maraton Botunu Başlat (Xvfb Sanal Ekran)
        if: env.SKIP_BOT != 'true'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python3 -u gta6_cloud_bot.py
