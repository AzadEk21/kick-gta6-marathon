name: GTA6_250h_Cloud_Marathon

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: gta6_250h_marathon_group
  cancel-in-progress: true

env:
  KICK_COOKIES: ${{ secrets.KICK_COOKIES_JSON }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  watch_gta6:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        worker_id: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Patchright Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgbm-dev
          pip install patchright requests
          patchright install chrome

      - name: Run Synchronized GTA 6 Worker (${{ matrix.worker_id }})
        env:
          WORKER_ID: ${{ matrix.worker_id }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u gta6_cloud_bot.py
