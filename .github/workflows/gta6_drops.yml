name: GTA6_250h_Cloud_Marathon

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: gta6_250h_marathon_group
  cancel-in-progress: true

env:
  KICK_COOKIES: ${{ secrets.KICK_COOKIES_JSON }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  watch_gta6:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Kalıcı Hafızayı Yükle (Cache)
        uses: actions/cache@v4
        with:
          path: marathon_state.json
          key: gta6-state-${{ github.run_id }}
          restore-keys: |
            gta6-state-

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıklar ve Patchright Chrome Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgbm-dev
          pip install patchright requests
          patchright install chrome

      - name: GTA VI Drops Maraton Botunu Başlat
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u gta6_cloud_bot.py

      - name: Katman 3 Kurtarma (Beklenmedik Çökme / Kapanma)
        if: failure()
        run: |
          python3 -c '
          import os, json, requests
          state = {}
          if os.path.exists("marathon_state.json"):
              try:
                  state = json.load(open("marathon_state.json", encoding="utf-8"))
              except Exception:
                  pass
          if not state.get("completed") and not state.get("paused"):
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              token = os.environ.get("GITHUB_TOKEN", "")
              if repo and token:
                  requests.post(
                      f"https://api.github.com/repos/{repo}/actions/workflows/gta6_drops.yml/dispatches",
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
                      json={"ref": "main"},
                      timeout=15
                  )
                  print("🔄 Katman 3 kurtarma tetiklendi.")
          '
